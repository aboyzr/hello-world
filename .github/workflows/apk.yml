name: Bina APK Android

on:
  push:
    branches: [master, ccr-e10f1478-9pxy5o]
    paths: ['kedai/**', 'obd/**', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Masukkan aplikasi web ke dalam APK
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r kedai android/app/src/main/assets/kedai
          mkdir -p android/app/src/main/assets/obd
          cp obd/*.html obd/*.js obd/*.css obd/*.svg android/app/src/main/assets/obd/

      # Kunci tetap dari secret ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASSWORD (jika ada),
      # supaya kemas kini boleh dipasang atas versi lama. Jika tiada, kunci sementara dibuat.
      - name: Sediakan kunci tandatangan
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "Guna kunci tetap dari secret"
          else
            KS_PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$KS" -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias aboy -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Aboy Workshop, L=Kuala Kangsar, ST=Perak, C=MY"
            echo "::warning::Tiada secret ANDROID_KEYSTORE_B64 - guna kunci sementara"
          fi
          echo "::add-mask::$KS_PASS"
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"

      - name: Bina APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../AboyWorkshop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AboyWorkshop-apk
          path: AboyWorkshop.apk

      - name: Terbitkan di Releases
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" AboyWorkshop.apk \
            --title "Aboy Workshop v1.0.${{ github.run_number }}" \
            --notes "Muat turun AboyWorkshop.apk di bawah dan buka di telefon Android untuk pasang." \
            --latest
